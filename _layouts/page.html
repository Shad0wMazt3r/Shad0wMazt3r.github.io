---
layout: default
---

<article class="page-shell">
  <header class="page-hero reveal">
    <p class="kicker"><span>FILE</span> / {{ page.title }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="page-deck">{{ page.description }}</p>{% endif %}
  </header>
  <div class="page-content reveal">
    {{ content }}
  </div>
</article>
