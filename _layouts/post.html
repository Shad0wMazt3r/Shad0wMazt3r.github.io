---
layout: default
---

<article class="post post-shell">
  <header class="post-header">
    <div class="post-meta">{{ page.date | date: "%B %e, %Y" }}</div>
    <h1>{{ page.title }}</h1>
    {% if page.excerpt %}
      <p>{{ page.excerpt | strip_html }}</p>
    {% endif %}
  </header>

  <div class="entry article-entry">
    {{ content }}
  </div>

  {% include navlinks.html %}
  {% include disqus.html %}
</article>
