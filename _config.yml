name: Shad0w / Notes
description: Security research, malware analysis, DFIR, and notes on building security agents.
avatar: ../images/logo.png
footer-links:
  dribbble:
  email:
  facebook:
  flickr:
  github: Shad0wMazt3r
  instagram:
  linkedin: 
  pinterest:
  rss: 
  twitter: 
  stackoverflow: 
  youtube: 
  googleplus:


disqus:
google_analytics:
url: https://shad0wmazt3r.github.io
baseurl: ""
permalink: /:title/
version: v1.3.0
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
sass:
  style: :expanded # You might prefer to minify using :compressed
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
plugins:
  - jekyll-sitemap # Create a sitemap using the official Jekyll sitemap gem
  - jekyll-feed # Create an Atom feed using the official Jekyll feed gem

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
